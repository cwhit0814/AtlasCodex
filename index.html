<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Codex</title>
  <meta name="description" content="Atlas Codex — every compound worth knowing, cited and graded.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body data-page="home">
  <header id="site-header"></header>
  <main>
    <div class="home">
      <!-- decorative molecule line art -->
      <svg class="molecule" style="right:110px;top:20px" width="80" height="60" viewBox="0 0 80 60" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M8 12l10-6 10 6v12l-10 6-10-6zM28 12l10-6 10 6v12l-10 6-10-6zM38 30v10l10 6 10-6V30M58 40l10 6"/><circle cx="8" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="48" cy="24" r="2.5"/><circle cx="68" cy="46" r="2.5"/><circle cx="58" cy="40" r="2.5"/></svg>
      <svg class="molecule" style="right:0;top:170px" width="170" height="100" viewBox="0 0 170 100" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 72l38-22 0-44M48 50l38 22 38-22 0-44M86 66l36-20M124 50l38 22"/><circle cx="10" cy="72" r="6"/></svg>
      <svg class="molecule" style="left:260px;top:130px" width="60" height="34" viewBox="0 0 60 34" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M6 10l10-6 10 6v10l-10 6-10-6zM26 10l12 6 12-4"/><circle cx="6" cy="10" r="2.5"/><circle cx="26" cy="20" r="2.5"/><circle cx="50" cy="12" r="2.5"/></svg>
      <svg class="molecule" style="left:40px;top:430px" width="120" height="120" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".5"><path d="M30 40l20-12 20 12v24l-20 12-20-12zM70 40l20-12 20 12M50 76v24"/><circle cx="50" cy="100" r="3"/></svg>

      <div class="ticker-wrap"><div class="ticker" id="ticker"></div></div>

      <section class="hero">
        <h1 id="hero-title"></h1>
        <p class="sub" id="hero-sub"></p>
        <div class="hero-search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="hero-search" type="search" readonly aria-label="Search the archive">
          <kbd id="hero-kbd"></kbd>
        </div>
        <div class="ask-row">
          <button class="ask-btn" id="ask-btn"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>ask atlas</button>
          <span>questions, not keywords — the archive answers</span>
        </div>
        <div class="chips" id="chips"></div>
      </section>

      <div class="cta-grid" id="cta"></div>

      <div class="wrap">
        <div class="section-head"><h2 class="label">recently updated</h2><a class="mono-sm violet" href="archive.html">full archive →</a></div>
        <div class="panel" id="recent"></div>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
