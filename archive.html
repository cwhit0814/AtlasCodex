<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive · Atlas Codex</title>
  <meta name="description" content="Atlas Codex: every compound worth knowing, cited and graded by its evidence.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>document.documentElement.classList.add('js')</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/load.js"></script>
</head>
<body data-page="archive">
  <header id="site-header"></header>
  <main>
    <header class="wrap spread page-title">
      <div class="side"><p data-rise style="--i:0">Every compound and guide in the codex, A to Z. Jump to a letter, or search by name, alias or tag.</p></div>
      <div class="main"><h1 class="lines"><span class="line"><span data-line style="--i:0">The record</span></span><span class="line"><span data-line style="--i:1">from A to Z</span></span></h1></div>
    </header>
    <div class="wrap spread" style="padding-bottom:var(--section)">
      <div class="side"><div class="filters" id="archive-filters" data-rise style="--i:1"></div></div>
      <div class="main" id="archive-list"></div>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
