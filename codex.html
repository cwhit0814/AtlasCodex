<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex · Atlas Codex</title>
  <meta name="description" content="Atlas Codex — an open reference library of peptides and research compounds.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</head>
<body data-page="codex">
  <header id="site-header"></header>
  <main>
    <div class="wrap">
      <header class="page-head">
        <p class="eyebrow">Index</p>
        <h1>The Codex</h1>
        <p>Every entry in Atlas Codex, A to Z. Filter by category or regulatory status, or search by name, alias or tag.</p>
      </header>
      <div class="toolbar">
        <input id="codex-q" type="search" placeholder="Filter entries…" aria-label="Filter entries">
        <select id="status-filter" aria-label="Filter by status"></select>
        <span class="count" id="codex-count"></span>
      </div>
      <div class="chips" id="cat-chips"></div>
      <nav class="az" id="az" aria-label="Jump to letter"></nav>
      <div id="codex-list" style="padding-bottom:48px"></div>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
