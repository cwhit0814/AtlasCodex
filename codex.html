<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Database · Atlas Codex</title>
  <meta name="description" content="Atlas Codex — every compound worth knowing, cited and graded.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</head>
<body data-page="codex">
  <header id="site-header"></header>
  <main>
    <div class="wrap">
      <header class="page-head">
        <span class="label">database</span>
        <h1>every entry in the codex</h1>
        <p>Filter by category or status, or search by name, alias or tag.</p>
      </header>
      <div class="toolbar">
        <input id="codex-q" type="search" placeholder="filter entries…" aria-label="Filter entries">
        <select id="status-filter" aria-label="Filter by status"></select>
        <select id="sort" aria-label="Sort">
          <option value="name">a → z</option>
          <option value="updated">recently updated</option>
        </select>
        <span class="mono-sm count" id="codex-count"></span>
      </div>
      <div class="chips" id="cat-chips"></div>
      <div class="panel" id="codex-list"></div>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
